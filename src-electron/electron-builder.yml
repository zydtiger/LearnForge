appId: top.ohzyd.learnforge
productName: LearnForge
directories:
  output: "src-electron/target/${version}"
  buildResources: build
files:
  - dist
  - src-electron/dist
linux:
  target:
    - appImage
    - flatpak
  category: Utility
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
flatpak:
  artifactName: ${productName}-${version}-${arch}.${ext}
  runtimeVersion: 24.08
  baseVersion: 24.08
mac:
  category: public.app-category.productivity
  target:
    - dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
